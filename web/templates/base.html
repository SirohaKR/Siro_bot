<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}시로냥 설정{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e3e6eb;
      --accent: #57a06e;
      --accent-dark: #3f8256;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }
    header {
      background: var(--accent);
      color: white;
      padding: 18px 24px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }
    main {
      max-width: 760px;
      margin: 24px auto 64px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
    }
    .card h2 { margin-top: 0; font-size: 16px; }
    .card p.desc { color: var(--muted); font-size: 13px; margin-top: -6px; }
    label { display: block; font-size: 13px; margin: 12px 0 4px; font-weight: 600; }
    select, input[type=text] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    .row { display: flex; gap: 10px; align-items: end; }
    .row > div { flex: 1; }
    .job-row { display: grid; grid-template-columns: 70px 1fr 70px; gap: 8px; align-items: center; margin-top: 8px; }
    .job-row span { font-size: 14px; }
    button {
      margin-top: 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    .current {
      font-size: 12px;
      color: var(--muted);
      background: #eef2f0;
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .tag { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>🐾 시로냥 설정 페이지</h1>
    <p>메이플스토리 길드 역할·채널 관리 — 여기서 정한 값대로 봇이 실제로 동작합니다.</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
