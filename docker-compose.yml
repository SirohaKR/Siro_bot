# 프로젝트 이름을 여기서 고정해두면, 어느 폴더/방법(GUI든 CLI든)으로 실행하든 항상
# 같은 프로젝트로 인식돼서 컨테이너 이름 충돌이 안 난다. Container Manager에서 만든
# "siro-bot" 프로젝트와 이름을 맞춰서, 앞으로는 -p 옵션 없이 "docker compose up"만
# 쳐도 자동으로 이 프로젝트로 인식된다.
name: siro-bot

services:
  sironyan-bot:
    build: .
    container_name: sironyan-bot
    restart: unless-stopped
    # TTS 음성(UDP)이 브릿지 네트워크의 NAT를 거치면서 조용히 유실되는 경우가 있어서,
    # 이 컨테이너만 호스트 네트워크를 그대로 쓰게 한다. 포트를 직접 여는 서비스가
    # 아니라서(디스코드로 나가는 연결만 함) 다른 서비스와 충돌할 일은 없다.
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  sironyan-web:
    build: .
    container_name: sironyan-web
    command: ["python", "web/app.py"]
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # 나스에 UtaHime(5050)도 같이 떠 있다면 포트가 겹치지 않게 5051처럼 다른 값을 쓰세요.
      # 왼쪽(호스트) 숫자만 바꾸면 되고, 오른쪽(컨테이너 내부) 5000은 그대로 둡니다.
      - "5051:5000"
    volumes:
      - ./data:/app/data
